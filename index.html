<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI System Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>AI System Login</h2>
        
        <div class="input-group">
            <input type="text" id="username" placeholder="Enter Username..." autocomplete="off">
        </div>

        <div class="ai-status-box" id="ai-status">
            Predicting User...
        </div>

        <div class="input-group">
            <label>Select Your City:</label>
            <select id="city">
                <option value="Bhopal">Bhopal</option>
                <option value="Indore">Indore</option>
                <option value="Jaipur">Jaipur</option>
                <option value="Gwalior">Gwalior</option>
            </select>
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="Password">
        </div>

<button class="btn" id="loginBtn">Access System</button>        <p id="error-msg" style="color: #ff6b6b; margin-top: 10px; font-size: 13px;"></p>
    </div>

    <script src="script.js"></script>
</body><script src="script.js"></script>
</html>
